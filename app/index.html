<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <title>AI Copywriting OS</title>
    <meta name="description" content="Central marketing operating system for digital product creators." />
    <script>
      // Apply theme before paint to avoid flash
      (function () {
        try {
          var t = localStorage.getItem("aicw.theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950">
    <div id="root"></div>
    <script>
      // Restore the original path from ?path= for GitHub Pages SPA fallback
      (function() {
        const params = new URLSearchParams(window.location.search);
        const path = params.get('path');
        if (path) {
          // Decode the path and prepend the /app basename so the React router
          // (mounted at /app/) can match routes like /app/blog/:slug.
          const decodedPath = decodeURIComponent(path);
          const basename = '/app';
          const fullPath = decodedPath.startsWith(basename)
            ? decodedPath
            : basename + decodedPath;
          window.history.replaceState({}, '', fullPath);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
