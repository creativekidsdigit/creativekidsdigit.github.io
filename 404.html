<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA fallback for /app/ routes
    const path = window.location.pathname + window.location.search + window.location.hash;
    if (path.startsWith('/app/')) {
      // Encode the original path and redirect to /app/index.html
      window.location.replace('/app/index.html?path=' + encodeURIComponent(path));
    } else {
      // Fallback to root for non-/app/ routes
      window.location.replace('/index.html?path=' + encodeURIComponent(path));
    }
  </script>
</head>
<body>
  <p>Redirecting to the app...</p>
</body>
</html>
