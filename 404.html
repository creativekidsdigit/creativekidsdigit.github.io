<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback — send everything to the React app at /app/
      const path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/app/index.html?path=' + encodeURIComponent(path));
    </script>
</head>
<body>
  <p>Redirecting to the app...</p>
</body>
</html>
